<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wrylark Status</title>
<meta name="description" content="Live status of the Wrylark Shorts factory: what is being made, what is scheduled, and views.">
<meta name="robots" content="noindex">
<style>
  :root {
    --bg: #f7f3ea; --panel: #fffdf8; --panel-2: #efe8da; --ink: #231d18; --ink-2: #57504a; --ink-3: #8c847a;
    --line: #e2d9c8; --accent: #2a78d6; --good: #1e8a3c; --warn: #b26a00; --bad: #c43c3c; --bar: #2a78d6;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #121110; --panel: #1b1916; --panel-2: #24211d; --ink: #efe9df; --ink-2: #b4ab9f; --ink-3: #7f776c;
            --line: #2f2b25; --accent: #3987e5; --good: #3fbf6a; --warn: #e0a030; --bad: #e66767; --bar: #3987e5; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
  main { max-width: 760px; margin: 0 auto; padding: 20px 16px 56px; }
  header { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  header b { font-size: 18px; letter-spacing: 2px; }
  header .sp { flex: 1; }
  .upd { font-size: 13px; color: var(--ink-3); text-align: right; }
  .stale { background: color-mix(in srgb, var(--warn) 16%, var(--panel)); border: 1px solid var(--warn); color: var(--ink);
           border-radius: 10px; padding: 10px 12px; margin-bottom: 12px; font-size: 14px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-bottom: 12px; }
  h2 { font-size: 15px; margin: 22px 0 8px; color: var(--ink-2); font-weight: 600; letter-spacing: .02em; }
  .pill { display: inline-block; font: 600 12px ui-monospace, Consolas, monospace; padding: 2px 9px; border-radius: 12px; border: 1px solid currentColor; }
  .making { color: var(--accent); } .idle { color: var(--good); } .waiting { color: var(--warn); } .off, .backing { color: var(--bad); }
  .prod-note { color: var(--ink-2); font-size: 14px; margin-top: 6px; }
  .now-title { font-size: 19px; font-weight: 700; line-height: 1.25; margin: 6px 0 10px; letter-spacing: -.01em; }
  .stages { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; }
  .stages div { height: 6px; border-radius: 3px; background: var(--panel-2); }
  .stages div.done, .stages div.skip { background: var(--good); }
  .stages div.run { background: var(--accent); }
  .stages div.fail { background: var(--bad); }
  .stages div.hold { background: var(--warn); }
  .stagelab { display: flex; justify-content: space-between; font-size: 12px; color: var(--ink-3); margin-top: 6px; }
  .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .tile { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
  .tile .k { font-size: 12.5px; color: var(--ink-2); }
  .tile .n { font-size: 24px; font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .list { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .row { display: grid; grid-template-columns: 40px 1fr auto; gap: 12px; align-items: center; padding: 9px 12px; border-top: 1px solid var(--line); }
  .row:first-child { border-top: 0; }
  .row img, .row .ph { width: 40px; aspect-ratio: 9/16; object-fit: cover; border-radius: 5px; background: var(--panel-2); display: block; }
  .row .t { font-weight: 600; font-size: 14.5px; line-height: 1.3; }
  .row .s { font-size: 12.5px; color: var(--ink-3); margin-top: 2px; }
  .row .r { text-align: right; font-size: 13px; color: var(--ink-2); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .row .r b { display: block; font-size: 15px; color: var(--ink); }
  .vbar { height: 4px; border-radius: 2px; background: var(--bar); margin-top: 6px; }
  .st { font: 600 11px ui-monospace, Consolas, monospace; }
  .st.scheduled { color: var(--accent); } .st.waiting, .st.review { color: var(--warn); } .st.published { color: var(--good); }
  a { color: var(--accent); }
  .log { font: 12.5px/1.6 ui-monospace, Consolas, monospace; color: var(--ink-2); background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
  .log div { display: grid; grid-template-columns: 46px 1fr; gap: 8px; }
  .log span:first-child { color: var(--ink-3); }
  .empty { color: var(--ink-3); padding: 14px; font-size: 14px; }
  footer { margin-top: 28px; font-size: 13px; color: var(--ink-3); }
  @media (max-width: 480px) { .tiles { grid-template-columns: repeat(2, 1fr); } .row .t { font-size: 14px; } }
</style>
</head>
<body>
<main>
  <header>
    <svg width="30" height="30" viewBox="0 0 46 46" aria-hidden="true"><circle cx="23" cy="23" r="21" fill="#1f78b4"/><ellipse cx="20" cy="30" rx="12" ry="8" fill="#e8812f"/><path d="M30 17 L45 15 L30 22 Z" fill="#231d18"/><circle cx="25" cy="17" r="3.2" fill="#231d18"/><rect x="21" y="12.5" width="8" height="4" fill="#1f78b4"/></svg>
    <b>WRYLARK</b><span style="color:var(--ink-3)">status</span>
    <span class="sp"></span><span class="upd" id="upd">loading…</span>
  </header>
  <div id="stale"></div>
  <div class="card" id="prod"></div>
  <div class="tiles" id="tiles"></div>
  <h2>Up next</h2>
  <div class="list" id="next"></div>
  <h2>Published</h2>
  <div class="list" id="pub"></div>
  <h2>Latest activity</h2>
  <div class="log" id="log"></div>
  <footer>Read-only view, refreshed by the PC about every half hour (sooner when something happens). The page itself reloads every 2 minutes.
    · <a href="../">Wrylark</a> · <a href="https://www.youtube.com/@wrylark">YouTube</a></footer>
</main>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = (n) => n == null ? '—' : Number(n).toLocaleString('en-US');
const short = (n) => n == null ? '—' : n >= 1e6 ? (n / 1e6).toFixed(1).replace(/\.0$/, '') + 'M' : n >= 1e3 ? (n / 1e3).toFixed(1).replace(/\.0$/, '') + 'k' : String(Math.round(n));
const when = (iso) => iso ? new Date(iso).toLocaleString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : '';
const hhmm = (iso) => iso ? new Date(iso).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' }) : '';
const ago = (iso) => { const m = Math.round((Date.now() - new Date(iso)) / 60000); return m < 1 ? 'just now' : m < 60 ? `${m} min ago` : m < 1440 ? `${Math.floor(m / 60)} h ${m % 60} min ago` : `${Math.floor(m / 1440)} d ago`; };
const SERIES = { copied: 'Copied From Nature', first: 'Nature Did It First', 'said-no': 'Nature Said No' };
const STLABEL = { scheduled: 'scheduled', waiting: 'waiting to upload', review: 'needs review', ready: 'ready', gated: 'gated', published: 'public' };

async function load() {
  let D;
  try { D = await (await fetch('data.json?' + Date.now(), { cache: 'no-store' })).json(); }
  catch (e) { $('upd').textContent = 'could not load data'; return; }
  const ageMin = (Date.now() - new Date(D.generated)) / 60000;
  $('upd').innerHTML = `updated ${ago(D.generated)}<br>${hhmm(D.generated)}`;
  $('stale').innerHTML = ageMin > 75 ? `<div class="stale">No update for ${ago(D.generated).replace(' ago', '')}. The PC is probably asleep or off, so nothing new is being made. Already scheduled Shorts still go public on time.</div>` : '';

  const P = D.producer || {}; const st = (P.state || 'off');
  const cls = st.startsWith('making') || st === 'refilling' ? 'making' : st === 'idle' ? 'idle' : st.startsWith('waiting') ? 'waiting' : st.startsWith('backing') ? 'backing' : 'off';
  const label = { making: 'making a Short', idle: 'buffer full, idle', waiting: 'waiting for Claude usage', backing: 'retrying after an error', off: 'not running', refilling: 'finding new topics' }[st === 'refilling' ? 'refilling' : cls];
  let html = `<span class="pill ${cls}">${esc(label)}</span><div class="prod-note">${esc(P.note || '')}${P.until ? ` · back at ${hhmm(P.until)}` : ''}</div>`;
  if (D.upload_blocked_until) html += `<div class="prod-note" style="color:var(--warn)">YouTube's daily upload limit: uploads resume after ${hhmm(D.upload_blocked_until)}.</div>`;
  const R = D.run;
  if (R && R.title) {
    const cur = D.stages.find((s) => s.key === R.stage);
    html += `<div class="now-title">${esc(R.title)}</div>
      <div class="stages">${D.stages.map((s) => `<div class="${R.stages?.[s.key]?.state || 'wait'}" title="${esc(s.name)}"></div>`).join('')}</div>
      <div class="stagelab"><span>${R.state === 'running' ? 'now: ' + esc(cur ? cur.name : R.stage || '') : esc(R.state || '')}</span><span>${esc(SERIES[R.series] || '')}</span></div>`;
  }
  $('prod').innerHTML = html;

  const O = D.overview || {};
  const sched = D.upcoming.filter((v) => v.status === 'scheduled').length;
  const tile = (k, n) => `<div class="tile"><div class="k">${k}</div><div class="n">${n}</div></div>`;
  $('tiles').innerHTML = tile('Public', fmt(D.published.length)) + tile('Scheduled', fmt(sched)) + tile('Waiting', fmt(D.upcoming.length - sched)) +
    tile('Total views', short(O.total_views)) + tile('Typical views', short(O.median_views)) + tile('Topics left', fmt(D.topics_left));

  const thumb = (v) => v.poster ? `<img src="${esc(v.poster)}" alt="" loading="lazy">` : '<span class="ph"></span>';
  $('next').innerHTML = D.upcoming.map((v) => `<div class="row">${thumb(v)}<div><div class="t">${esc(v.title)}</div>
      <div class="s"><span class="st ${esc(v.status)}">${esc(STLABEL[v.status] || v.status)}</span> · ${esc(SERIES[v.series] || '')}${v.note ? ' · ' + esc(v.note) : ''}</div></div>
      <div class="r"><b>${esc(when(v.publish_at).split(', ')[1] || '')}</b>${esc(when(v.publish_at).split(', ')[0] || '')}</div></div>`).join('') || '<div class="empty">Nothing queued.</div>';
  const maxv = Math.max(1, ...D.published.map((v) => v.views || 0));
  $('pub').innerHTML = D.published.map((v) => `<div class="row">${thumb(v)}<div><div class="t">${v.url ? `<a href="${esc(v.url)}" style="color:inherit;text-decoration:none">${esc(v.title)}</a>` : esc(v.title)}</div>
      <div class="s">${esc(when(v.published || v.publish_at))}${v.avg_pct ? ` · ${v.avg_pct}% viewed` : ''}</div>
      ${v.views != null ? `<div class="vbar" style="width:${Math.max(2, 100 * v.views / maxv)}%"></div>` : ''}</div>
      <div class="r"><b>${v.views != null ? fmt(v.views) : '—'}</b>views</div></div>`).join('') || '<div class="empty">Nothing public yet.</div>';
  $('log').innerHTML = [...D.log].reverse().slice(0, 15).map((l) => `<div><span>${hhmm(l.t)}</span><span>${esc(l.msg)}</span></div>`).join('');
}
load();
setInterval(load, 120000);
</script>
</body>
</html>
